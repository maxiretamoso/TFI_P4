<rect x="53" y="72" width="14" height="18" rx="5" fill="#f5d0b5"/>
<g class="cabeza" style="animation-delay:-2.22s">
<ellipse cx="88" cy="62" rx="8" ry="16" fill="#b5482b" transform="rotate(-12 88 62)"/>
<circle cx="36" cy="55" r="5.5" fill="#f5d0b5"/><circle cx="84" cy="55" r="5.5" fill="#f5d0b5"/>
<circle cx="60" cy="52" r="24" fill="#f5d0b5"/>

<g class="ojos" style="animation-delay:-2.22s"><circle cx="51" cy="52" r="2.9" fill="#2a2420"/><circle cx="69" cy="52" r="2.9" fill="#2a2420"/></g>
<circle cx="46" cy="61" r="3.6" fill="#f08f8f" opacity=".35"/><circle cx="74" cy="61" r="3.6" fill="#f08f8f" opacity=".35"/>
<path d="M52 63 Q60 70 68 63" fill="none" stroke="#7a3b2e" stroke-width="2.4" stroke-linecap="round"/>
