<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Avatar 6">
<style>
.cabeza{animation:balanceo 3.2s ease-in-out infinite alternate;transform-origin:60px 86px}
.ojos{animation:parpadeo 4.5s infinite;transform-origin:60px 52px}
