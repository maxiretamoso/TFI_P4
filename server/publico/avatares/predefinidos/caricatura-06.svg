@keyframes parpadeo{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.cabeza,.ojos{animation:none}}
</style>
<circle cx="60" cy="60" r="60" fill="#d4efea"/>
